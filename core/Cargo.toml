[package]
name = "music-core"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[lib]
name = "music_core"

[dependencies]
ureq = { version = "3.5", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusty-opus = "1.0.2"
symphonia = { version = "0.6.1", default-features = false, features = ["isomp4", "aac", "mp3"] }
rubato = "5.0.1"
cpal = { version = "0.18.2", features = ["realtime"] }
rtrb = "0.4"
crossbeam-channel = "0.5"
log = "0.4"
dirs = "7"
sha1 = "0.10"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    # Music-video pictures: Media Foundation decode, hardware-accelerated through D3D11.
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
] }
# The `implement` macro (an IStream for Media Foundation) names this crate; already in the tree.
windows-core = "0.62"
