[package]
name = "music-core"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[lib]
name = "music_core"

[[bin]]
name = "music-cli"
path = "src/bin/music-cli.rs"

[dependencies]
ureq = { version = "3.5", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusty-opus = "1.0.2"
symphonia = { version = "0.6.1", default-features = false, features = ["isomp4", "aac"] }
rubato = "5.0.1"
cpal = { version = "0.18.2", features = ["realtime"] }
rtrb = "0.4"
crossbeam-channel = "0.5"
log = "0.4"
dirs = "7"
