[workspace]
resolver = "3"
members = ["core", "signin", "app", "together"]
# The audio test harness is local only and builds on its own.
exclude = ["cli"]

[workspace.package]
edition = "2024"
publish = false

[patch.crates-io]
rusty-opus = { path = "vendor/rusty-opus" }

[profile.release]
debug = 1
lto = "thin"
codegen-units = 4

# The decoder and EQ must keep up even in debug builds.
[profile.dev.package."*"]
opt-level = 3
[profile.dev.package.music-core]
opt-level = 1
