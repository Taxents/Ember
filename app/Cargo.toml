[package]
name = "music-app"
version = "0.4.1"
edition.workspace = true
publish.workspace = true

[[bin]]
name = "ember"
path = "src/main.rs"

[dependencies]
music-core = { path = "../core" }
signin = { path = "../signin" }
together = { path = "../together" }
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "raw-window-handle-06", "accessibility"] }
raw-window-handle = "0.6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
crossbeam-channel = "0.5"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
windows = { version = "0.62", features = [
    "Foundation",
    "Media",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
sha2 = "0.10"
minisign-verify = "0.3.0"

[build-dependencies]
slint-build = "=1.18.1"
winresource = "0.1"
